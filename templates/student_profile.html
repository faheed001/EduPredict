{% extends 'base.html' %}{% block title %}My Profile{% endblock %}{% block content %}<h1 class="page-title">My Profile</h1><form class="card form-card" method="POST"><input type="hidden" name="_csrf" value="{{csrf_token}}"><div class="form-row"><label>Full Name<input name="full_name" value="{{student.full_name}}" required></label><label>Student Code<input value="{{student.student_code}}" disabled></label></div><div class="form-row"><label>Email<input type="email" name="email" value="{{student.email or ''}}"></label><label>Course<input name="course" value="{{student.course or ''}}"></label></div><label>Year<input name="year" value="{{student.year or ''}}"></label><button class="btn btn-primary">Save Profile</button></form>{% endblock %}
