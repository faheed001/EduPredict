{% extends 'base.html' %}
{% block title %}Log Academic Performance Update{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">📝 Log Performance Update</h1>
    <p class="page-subtitle">Records your latest academic indicators to evaluate progress and update early-warning analytics.</p>
  </div>
  <div>
    <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary btn-small">← Back to Overview</a>
  </div>
</div>

<form method="POST" class="card form-card" style="max-width: 820px; margin: 0 auto;">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">

  <div class="form-row">
    <label>
      Attendance Percentage (%)
      <input type="number" step="0.1" min="0" max="100" name="attendance_percentage" value="85" required>
      <small class="muted">Campus target: 85%+</small>
    </label>
    <label>
      Weekly Study Hours
      <input type="number" step="0.1" min="0" max="80" name="study_hours_per_week" value="18" required>
      <small class="muted">Dedicated distraction-free study</small>
    </label>
  </div>

  <div class="form-row">
    <label>
      Previous Examination Mark (0–100)
      <input type="number" step="0.1" min="0" max="100" name="previous_exam_score" value="74" required>
    </label>
    <label>
      Assignment Grade Average (0–100)
      <input type="number" step="0.1" min="0" max="100" name="assignment_score" value="72" required>
    </label>
  </div>

  <div class="form-row">
    <label>
      Internal Assessment Mark (0–100)
      <input type="number" step="0.1" min="0" max="100" name="internal_assessment_score" value="70" required>
    </label>
    <label>
      Nightly Sleep Average (Hours)
      <input type="number" step="0.1" min="0" max="14" name="sleep_hours" value="7.5" required>
    </label>
  </div>

  <div class="form-row">
    <label>
      Parental & Mentor Support Level
      <select name="parental_support">
        {% for v, l in parental_labels.items() %}
          <option value="{{ v }}" {% if v == 1 %}selected{% endif %}>{{ l }} Support</option>
        {% endfor %}
      </select>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" name="extracurricular_activities" value="1" checked>
      <span>Participates in Extracurricular Activities</span>
    </label>
  </div>

  <button class="btn btn-primary btn-block" style="margin-top: 18px; padding: 14px; font-size: 1rem;">
    <span>💾</span> Commit Update & Run Model Inference
  </button>
</form>
{% endblock %}
