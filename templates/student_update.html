{% extends 'base.html' %}{% block title %}Update Performance{% endblock %}{% block content %}<h1 class="page-title">Update Performance</h1><p class="page-subtitle">This creates a new database record and runs the AI pipeline immediately.</p><form method="POST" class="card form-card"><input type="hidden" name="_csrf" value="{{csrf_token}}"><div class="form-row"><label>Attendance %<input type="number" step="0.1" min="0" max="100" name="attendance_percentage" value="80" required></label><label>Study Hours / Week<input type="number" step="0.1" min="0" max="80" name="study_hours_per_week" value="15" required></label></div><div class="form-row"><label>Previous Exam Score<input type="number" step="0.1" min="0" max="100" name="previous_exam_score" value="65" required></label><label>Assignment Score<input type="number" step="0.1" min="0" max="100" name="assignment_score" value="70" required></label></div><div class="form-row"><label>Internal Assessment Score<input type="number" step="0.1" min="0" max="100" name="internal_assessment_score" value="68" required></label><label>Sleep Hours / Night<input type="number" step="0.1" min="0" max="14" name="sleep_hours" value="7" required></label></div><div class="form-row"><label>Parental Support<select name="parental_support">{% for v,l in parental_labels.items() %}<option value="{{v}}">{{l}}</option>{% endfor %}</select></label><label class="checkbox-label"><input type="checkbox" name="extracurricular_activities" value="1"> Participates in Extracurricular Activities</label></div><button class="btn btn-primary btn-block">Save &amp; Run AI Prediction</button></form>{% endblock %}
