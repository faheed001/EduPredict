{% extends 'base.html' %}
{% block title %}Student Enrollment — EduPredict Pro{% endblock %}

{% block content %}
<div class="auth-card card">
  <div style="text-align: center; margin-bottom: 24px;">
    <div class="brand-icon" style="margin: 0 auto 12px; width: 46px; height: 46px; font-size: 1.4rem;">🎓</div>
    <h1 style="font-size: 1.8rem; margin: 0 0 6px;">Student Registration</h1>
    <p class="page-subtitle" style="margin: 0;">Enroll in the AI-assisted academic success program.</p>
  </div>

  <form method="POST">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">

    <div class="form-row">
      <label>
        Full Name
        <input name="full_name" placeholder="Jane Doe" required>
      </label>
      <label>
        Student Code / ID
        <input name="student_code" placeholder="e.g. STU1042" required>
      </label>
    </div>

    <div class="form-row">
      <label>
        Account Username
        <input name="username" placeholder="janedoe" required>
      </label>
      <label>
        Account Password
        <input type="password" name="password" minlength="6" placeholder="At least 6 characters" required>
      </label>
    </div>

    <label>
      Campus Email (Optional)
      <input type="email" name="email" placeholder="jane.doe@campus.edu">
    </label>

    <div class="form-row">
      <label>
        Degree / Course
        <input name="course" placeholder="Computer Science">
      </label>
      <label>
        Academic Year
        <input name="year" placeholder="3">
      </label>
    </div>

    <button class="btn btn-primary btn-block" style="padding: 13px; font-size: 1rem; margin-top: 14px;">
      <span>Complete Registration</span> ➔
    </button>
  </form>

  <p class="muted" style="text-align: center; margin-top: 22px; font-size: 0.9rem;">
    Already enrolled? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
  </p>
</div>
{% endblock %}
