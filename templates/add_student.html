{% extends 'base.html' %}{% block title %}Add Student{% endblock %}{% block content %}<div class="auth-card card"><h1>➕ Add Student</h1><p class="muted">Teacher-created accounts can immediately log in and submit live performance data.</p><form method="POST"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Full name<input name="full_name" required></label><label>Student code<input name="student_code" required></label><label>Username<input name="username" required></label><label>Temporary password<input type="password" name="password" minlength="6" required></label><label>Email<input type="email" name="email"></label><div class="form-row"><label>Course<input name="course"></label><label>Year<input name="year"></label></div><button class="btn btn-primary btn-block">Create Account</button></form></div>{% endblock %}
